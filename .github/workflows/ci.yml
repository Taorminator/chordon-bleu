name: CHORDON BLEU checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  instrument:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate offline recipe bundle
        run: node tools/build-recipes.mjs --check
      - name: Verify browser module dependency graph
        run: node tests/pages-artifact.test.mjs .
      - name: Prevent unreviewed boot/PLL changes and firmware release
        run: node tests/boot-safety.test.mjs
      - name: Refuse mismatched Felucca checkout before overlay writes
        run: python3 tests/overlay_preflight.test.py
      - name: Bass-track model and legacy playback compatibility
        run: |
          node tests/bass-track.test.mjs
          node tests/bass-generator.test.mjs
      - name: Validate integrated DX7 presets and browser lifecycle
        run: |
          node tools/build-dx7-presets.mjs --check
          node tests/dx7-presets.test.mjs
      - name: Verify physical FM1 button grid and control dispatch
        run: node tests/fm1-panel.test.mjs
      - name: Validate FM1 browser device surface
        run: node tests/device-view.test.mjs
      - name: Verify plated Cordon Bleu browser illustration
        run: node tests/recipe-visual.test.mjs
      - name: Test chord performance controls and octave voicing
        run: node tests/performance.test.mjs
      - name: Browser performance controls and expanded recipes
        run: node tests/browser-performance.test.mjs
      - name: Color-blocked UI and readable, playable chord cards
        run: node tests/color-block-ui.test.mjs
      - name: Safari audio, new instruments and grouped UI
        run: node tests/safari-synth-ui.test.mjs
      - name: Pencil-sketch UI, BPM, PUNCH, DX7 ROM1A and GRAND regression
        run: node tests/sketch-controls-dx7.test.mjs
      - name: Exercise harmonic search and arpeggiator
        run: |
          node tests/harmony.test.mjs
          node tests/recipes.test.mjs
      - name: MIDI loop export structure and playback timing
        run: |
          node tests/midi-export.test.mjs
          node tests/saved-actions.test.mjs
          node tests/midi-import.test.mjs
      - name: Shareable idea links and disclosure preview
        run: node tests/share-idea.test.mjs
      - name: C99 harmony research core
        run: |
          cc -std=c99 -O2 -Wall -Wextra -Werror -pedantic core/chordon_harmony.c tests/core_test.c -o /tmp/chordon-harmony-test
          /tmp/chordon-harmony-test
      - name: Portable FM1 application simulation (not a firmware build)
        run: |
          cc -std=c99 -O2 -Wall -Wextra -Werror -pedantic core/chordon_harmony.c firmware/cb_fm1.c tests/device_test.c -o /tmp/chordon-device-test
          /tmp/chordon-device-test
      - name: Crash-safe snapshot power-cut fault injection (ASan / UBSan)
        run: |
          cc -std=c99 -O1 -g -Wall -Wextra -Werror -pedantic -fsanitize=address,undefined -fno-omit-frame-pointer core/chordon_harmony.c firmware/cb_fm1.c firmware/cb_store.c tests/store_test.c -o /tmp/chordon-store
          ASAN_OPTIONS=detect_leaks=1 /tmp/chordon-store
      - name: Four-voice gate and stuck-note stress (ASan / UBSan)
        run: |
          cc -std=c99 -O1 -g -Wall -Wextra -Werror -pedantic -fsanitize=address,undefined -fno-omit-frame-pointer firmware/cb_voice.c tests/voice_test.c -o /tmp/chordon-voice
          ASAN_OPTIONS=detect_leaks=1 /tmp/chordon-voice
      - name: Install status safety
        run: |
          test -s install/index.html
          grep -q 'NOT INSTALLABLE YET' install/index.html
      - name: Never publish untested FM1 binaries
        run: |
          test -s index.html
          grep -q GHIBLI index.html
          if find . -type f \( -name '*.fwsc' -o -name '*.bin' \) | grep .; then
            echo 'Unverified device firmware found' >&2
            exit 1
          fi
