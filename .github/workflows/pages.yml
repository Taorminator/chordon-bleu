name: Publish CHORDON BLEU browser demo
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate bundled recipes
        run: node tools/build-recipes.mjs --check
      - name: Validate bundled DX7 sounds
        run: node tools/build-dx7-presets.mjs --check
      - name: Assemble browser instrument and retained Classic demo
        run: node tools/build-browser.mjs
      - name: Verify packaged browser module graph
        run: node tests/pages-artifact.test.mjs dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Smoke test deployed browser runtime
        env:
          DEMO_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${DEMO_URL%/}"
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          curl --fail --silent --show-error --retry 5 --retry-delay 3 --retry-connrefused "$base/" -o "$tmpdir/index.html"
          grep -q 'core/minimal-app.mjs' "$tmpdir/index.html"
          for asset in minimal.css core/minimal-app.mjs core/minimal-session.mjs core/minimal-harmony.mjs core/minimal-audio.mjs classic.html core/browser-bass-bootstrap.js core/bass-track.js core/bass-generator.js; do
            curl --fail --silent --show-error --retry 5 --retry-delay 3 --retry-connrefused "$base/$asset" -o "$tmpdir/$(basename "$asset")"
          done
          grep -q 'class Session' "$tmpdir/minimal-session.mjs"
          grep -q 'class Piano' "$tmpdir/minimal-audio.mjs"
          grep -q 'chordon-bass-ready' "$tmpdir/browser-bass-bootstrap.js"
          echo "Deployed minimal instrument and retained Classic dependencies are reachable."
