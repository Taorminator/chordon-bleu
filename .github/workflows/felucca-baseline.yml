name: Felucca native build and regression reference
# Diagnostic only. Never publishes or installs a firmware image.
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/felucca-baseline.yml"
permissions:
  contents: read
jobs:
  upstream-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned upstream Felucca
        uses: actions/checkout@v4
        with:
          repository: hugelton/Felucca
          ref: 9f6a8858afd71b4faed9dfea3a5f94d3ecfdf002
          path: upstream
          persist-credentials: false
      - name: Python build dependencies
        run: python3 -m pip install --break-system-packages Pillow fonttools
      - name: Fetch JieLi toolchain
        run: |
          cd upstream
          sh tools/get_toolchain.sh
          test -x "$HOME/.jieli/toolchain/pi32v2/bin/clang"
      - name: Fetch upstream SDK assets
        run: |
          git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git "$HOME/fw-AC79_AIoT_SDK"
          test -f "$HOME/fw-AC79_AIoT_SDK/cpu/wl82/tools/uboot.boot"
      - name: Compile CHORDON BLEU native core with JieLi target compiler
        run: |
          mkdir -p /tmp/chordon-pi32
          "$HOME/.jieli/toolchain/pi32v2/bin/clang" -target pi32v2 -DCB_FREESTANDING -std=c99 -Os -ffreestanding -Wall -Wextra -Werror -Icore -c core/chordon_harmony.c -o /tmp/chordon-pi32/harmony.o
          "$HOME/.jieli/toolchain/pi32v2/bin/clang" -target pi32v2 -DCB_FREESTANDING -std=c99 -Os -ffreestanding -Wall -Wextra -Werror -Icore -Ifirmware -c firmware/cb_fm1.c -o /tmp/chordon-pi32/controller.o
          "$HOME/.jieli/toolchain/pi32v2/bin/clang" -target pi32v2 -DCB_FREESTANDING -std=c99 -Os -ffreestanding -Wall -Wextra -Werror -Ifirmware -c firmware/cb_voice.c -o /tmp/chordon-pi32/voice.o
          "$HOME/.jieli/toolchain/pi32v2/bin/clang" -target pi32v2 -DCB_FREESTANDING -std=c99 -Os -ffreestanding -Wall -Wextra -Werror -Ifirmware -c firmware/cb_store.c -o /tmp/chordon-pi32/store.o
      - name: Compile original Felucca firmware reference
        run: |
          cd upstream
          ./build.sh
          test -s build/felucca.bin
          test -s build/felucca.fwsc
          echo "Upstream Felucca reference built. NOT a CHORDON BLEU installable firmware."
      - name: Host test portability fix (upstream test harness missing stdint)
        run: |
          sed -i '/sys\/time.h/a #include <stdint.h>' upstream/tests/drumfuzz_test.c
      - name: Felucca upstream host regression suite
        run: |
          cd upstream
          sh tests/run_tests.sh
      - name: Patch pinned Felucca checkout with experimental CHORDON app
        run: |
          python3 firmware/felucca-overlay/apply.py upstream
          grep -q 'chordon/platform.c' upstream/firmware/src/felucca.c
      - name: Link native CHORDON screens, inputs and voices against Felucca
        run: |
          cd upstream
          ./build.sh
          test -s build/felucca.bin
          echo "EXPERIMENTAL ONLY: binary has not passed device/flash validation. DO NOT INSTALL."
      - name: Felucca host regression after CHORDON integration
        run: |
          cd upstream
          sh tests/run_tests.sh
      - name: 'Security - never upload upstream test firmware'
        run: |
          echo "No .bin or .fwsc release artifacts are published by this workflow."
